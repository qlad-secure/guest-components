[package]
name = "confidential-data-hub"
version = "0.1.0"
authors = ["The Confidential Container Authors"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "ttrpc-cdh"
required-features = ["bin", "ttrpc"]

[[bin]]
name = "grpc-cdh"
required-features = ["bin", "grpc"]

[[bin]]
name = "ttrpc-cdh-tool"
required-features = ["bin", "ttrpc"]

[[bin]]
name = "grpc-cdh-tool"
required-features = ["bin", "grpc"]

[[bin]]
name = "cdh-oneshot"
required-features = ["bin"]

[[bin]]
name = "secret"
path = "src/bin/secret_cli.rs"
required-features = ["cli"]

[[bin]]
name = "gcp-proof-preparation"
required-features = ["gcp-production"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
attestation-agent = { path = "../../attestation-agent/attestation-agent", default-features = false }
base64.workspace = true
cfg-if.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
config = { workspace = true }
const_format.workspace = true
crypto.path = "../../attestation-agent/deps/crypto"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
image-rs = { path = "../../image-rs", default-features = false, features = [
    "kata-cc-aws-lc-rs-tls",
] }
jose-b64 = "0.1.2"
jose-jwa = "0.1.2"
jose-jwk = "0.1.2"
jose-jws = "0.1.2"
kms = { path = "../kms", default-features = false, features = ["kbs"] }
kbs_protocol = { path = "../../attestation-agent/kbs_protocol", default-features = false, features = ["launch-recorder"], optional = true }
execution-proof-client = { path = "../../../execution-proof-prototype/client", optional = true }
execution-proof-contract = { path = "../../../execution-proof-prototype/contract", optional = true }
execution-proof-handoff = { path = "../../../execution-proof-prototype/handoff", optional = true }
sha2 = { workspace = true, optional = true }
libcryptsetup-rs = { version = "0.13.1", optional = true, features = ["mutex"] }
nix.workspace = true
percent-encoding.workspace = true
p256 = "0.13.2"
prost = { workspace = true, optional = true }
protos = { path = "../../protos", default-features = false, optional = true }
rand.workspace = true
resource_uri.path = "../../attestation-agent/deps/resource_uri"
serde.workspace = true
serde_json.workspace = true
shadow-rs = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "macros",
    "io-util",
    "process",
    "rt-multi-thread",
    "sync",
] }
tonic = { workspace = true, optional = true }
ttrpc = { workspace = true, features = ["async"], optional = true }
uuid = { workspace = true, features = ["fast-rng", "v4"] }
which = "8.0.2"
zeroize.workspace = true

[build-dependencies]
anyhow.workspace = true
shadow-rs.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
assert-json-diff.workspace = true
nix.workspace = true
rstest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["aliyun", "kbs", "bin", "ttrpc", "grpc", "cli", "mlkem"]

# Attempt-owned memory-only GCP credentials; no global initialization or files.
launch-credential = ["kms/launch-credential", "dep:kbs_protocol", "dep:execution-proof-contract", "dep:execution-proof-handoff", "dep:sha2"]
launch-credential-gcp = ["launch-credential", "kbs_protocol/launch-recorder-gcp", "kms/launch-credential-gcp"]
launch-preparation = ["launch-credential"]
launch-preparation-gcp = ["launch-preparation", "launch-credential-gcp"]
launch-preparation-content-gcp = ["launch-preparation-content", "launch-preparation-gcp"]
launch-preparation-content = ["launch-preparation", "image-rs/launch-preparation-signature", "image-rs/launch-preparation-content"]
launch-preparation-runtime = ["launch-preparation-content", "image-rs/launch-preparation-registry", "dep:execution-proof-client", "tokio/time"]
launch-preparation-runtime-gcp = ["launch-preparation-runtime", "launch-preparation-content-gcp"]
launch-preparation-executable = ["launch-preparation-runtime", "image-rs/launch-preparation-executable"]
# Pinned native build, actual readback and sealed backing; no mount/start permit.
launch-preparation-erofs = ["launch-preparation-executable", "image-rs/launch-preparation-erofs"]
launch-preparation-mount = ["launch-preparation-erofs", "image-rs/launch-preparation-mount"]
launch-preparation-offer = ["launch-preparation-erofs", "image-rs/launch-preparation-offer", "execution-proof-handoff/rootfs-transfer"]
launch-preparation-custody = ["launch-preparation-offer", "image-rs/launch-preparation-custody", "execution-proof-handoff/rootfs-custody"]
launch-preparation-custody-native = ["launch-preparation-custody", "image-rs/launch-preparation-receive"]
# Closed measured startup only; this binary never initializes the generic Hub.
gcp-production = ["launch-preparation-runtime-gcp", "launch-preparation-custody", "kbs_protocol/launch-recorder-gcp-tdx", "execution-proof-handoff/gcp-startup", "execution-proof-client/https", "tokio/net", "dep:flate2"]

# support aliyun stacks (KMS, ..)
aliyun = ["kms/aliyun"]

# support aws stacks (KMS, Secrets Manager)
aws = ["kms/aws"]

# support azure stacks (Key Vault)
azure = ["kms/azure"]

# support gcp stacks (Cloud KMS)
gcp = ["kms/gcp"]

# support coco-KBS to provide confidential resources
kbs = ["kms/kbs"]

mlkem = ["crypto/mlkem"]

kms_unwrap = ["crypto/kms_unwrap"]

# Binary RPC type
bin = ["clap", "shadow-rs", "tracing-subscriber"]
ttrpc = ["dep:ttrpc", "tokio/signal", "protos/ttrpc"]
grpc = ["prost", "tonic", "tokio/signal", "protos/grpc"]

# for secret_cli
cli = ["clap/derive", "tokio/rt-multi-thread", "tokio/sync", "tokio/macros"]
