[package]
name = "crypto"
version = "0.1.0"
authors = ["The Attestation Agent Authors"]
publish = false
edition = "2021"
license = "Apache-2.0"

[dependencies]
aes-gcm = { workspace = true, optional = true }
aes-kw = { version = "0.2.1", optional = true }
anyhow.workspace = true
tracing.workspace = true
base64.workspace = true
concat-kdf = { version = "0.1.0", optional = true }
ctr = { workspace = true, optional = true }
kbs-types.workspace = true
openssl = { workspace = true, features = ["vendored"], optional = true }
p256 = { version = "0.13.1", features = ["ecdh", "pem"], optional = true }
p521 = { version = "0.13.3", features = ["ecdh", "pem"], optional = true }
rand.workspace = true
ml-kem = { version = "0.3.0", optional = true }
rand_core = { version = "0.6", optional = true }
rand_chacha = { version = "0.3", optional = true }
getrandom = { version = "0.4", optional = true, default-features = false, features = ["sys_rng"] }

# This is for API compability of p256 who is using the old version of `rand`
rand_08 = { package = "rand", version = "0.8", optional = true }
rsa = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hkdf = { version = "0.12", optional = true }
strum.workspace = true
zeroize.workspace = true

[dev-dependencies]
rstest.workspace = true

[features]
default = ["rust-crypto", "mlkem"]
rust-crypto = [
    "dep:aes-gcm",
    "ctr",
    "rsa/sha2",
    "aes-kw",
    "concat-kdf",
    "p256",
    "p521",
    "rand_08",
]
openssl = ["dep:openssl"]
mlkem = ["ml-kem", "dep:getrandom", "rand_08", "hkdf"]
