[package]
name = "onb17-ocicrypt-source-checks"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ocicrypt_rs"
path = "../../../../ocicrypt-rs/src/lib.rs"

[features]
default = []
block-cipher = []
block-cipher-ring = ["block-cipher"]
async-io = []
# Unselected upstream axes remain named for source cfg checking only.
block-cipher-openssl = []
keywrap-jwe = []
keywrap-keyprovider = []
keywrap-keyprovider-cmd = []
keywrap-keyprovider-grpc = []
keywrap-keyprovider-ttrpc = []
keywrap-keyprovider-native = []

[dependencies]
anyhow = "=1.0.103"
aes = "=0.9.2"
base64 = "=0.23.1"
base64-serde = "=0.8.0"
cfg-if = "=1.0.4"
ctr = "=0.10.0"
hmac = "=0.13.0"
pin-project-lite = "=0.2.17"
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["rt", "io-util"] }
tracing = "=0.1.44"
