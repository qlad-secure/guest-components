[package]
name = "onb17-kms-gcp-source-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Resolve the GCP provider and its registry SDK dependencies. Optional Git/native
# backends from the parent workspace are excluded.
[workspace]

[lib]
name = "kms"
path = "src/lib.rs"

[features]
default = ["gcp", "launch-credential"]
gcp = []
launch-credential = ["gcp"]
launch-credential-gcp = ["launch-credential", "dep:google-cloud-gax", "tokio/time"]
# Recognize provider error cfgs without compiling the other providers.
aliyun = []
aws = []
azure = []

[dependencies]
async-trait = "=0.1.89"
const_format = "=0.2.36"
google-cloud-auth = { version = "=1.16.0", default-features = false }
google-cloud-kms-v1 = "=1.14.0"
google-cloud-gax = { version = "=1.15.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "macros", "rt", "sync"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["net", "io-util", "rt", "macros", "test-util"] }
