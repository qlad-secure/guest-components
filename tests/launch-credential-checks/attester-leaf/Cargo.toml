[package]
name = "onb17-attester-source-checks"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
name = "attester"
path = "../../../attestation-agent/attester/src/lib.rs"
[features]
default = []
tdx-attester = ["dep:scroll", "tsm-report", "dep:iocuddle", "dep:zerocopy"]
tsm-report = ["dep:tempfile"]
[dependencies]
anyhow = "=1.0.103"
async-trait = "=0.1.89"
base64 = "=0.23.1"
cfg-if = "=1.0.4"
crypto = { package = "onb17-crypto-source-checks", path = "../crypto-leaf" }
hex = "=0.4.3"
kbs-types = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_with = { version = "=3.22.0", features = ["base64", "hex"] }
sha2 = "=0.11.0"
strum = { version = "=0.28.0", features = ["derive"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt", "macros", "fs", "io-util"] }
tracing = "=0.1.44"
num-traits = "=0.2.19"
tempfile = { version = "=3.27.0", optional = true }
scroll = { version = "=0.13.0", default-features = false, features = ["derive", "std"], optional = true }
iocuddle = { version = "=0.3.0", optional = true }
zerocopy = { version = "=0.8.54", features = ["derive"], optional = true }
[dev-dependencies]
rstest = "=0.26.1"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("az-snp-vtpm-attester", "az-tdx-vtpm-attester", "cca-attester", "sgx-attester", "snp-attester", "csv-attester", "hygon-dcu-attester", "se-attester", "tpm-attester", "nvidia-attester", "nvidia-dpu-attester", "tdx-attest-dcap-ioctls"))'] }
[lints.clippy]
# The attester trait generates duplicate must_use annotations through async_trait.
double_must_use = "allow"
# Scroll Pread derives in tdx/report.rs generate redundant field names.
redundant_field_names = "allow"
